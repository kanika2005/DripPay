services:
  mysql:
    image: mysql:8.0
    container_name: drippay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: drippay
    ports:
      - "3306:3306"
    volumes:
      - drippay_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  drippay_mysql_data:
